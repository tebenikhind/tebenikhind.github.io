<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог софта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: a two-pane code editor. Left is a collapsible folder tree of programs, right is the selected program written out as a Python dict. */
:root {
  --bg: #12141a;
  --panel: #1a1d25;
  --panel-2: #20242e;
  --line: #2b303c;
  --fg: #d7dce6;
  --dim: #8089a0;
  --blue: #5a9fd8;
  --yellow: #ffd43b;
  --str: #e8c96a;
  --kw: #c792ea;
  --com: #6f7b92;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; }
header { margin-bottom: 18px; }
h1 {
  margin: 0;
  font-family: var(--mono);
  font-weight: 700;
  font-size: clamp(24px, 5vw, 34px);
  letter-spacing: -.01em;
}
h1 .b { color: var(--blue); }
h1 .y { color: var(--yellow); }
.sub { margin: 6px 0 0; color: var(--dim); max-width: 62ch; }
.note {
  margin: 12px 0 0; font-size: 13px; color: var(--dim);
  font-family: var(--mono);
}
.note b { color: var(--yellow); font-weight: 500; }
.app { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; overflow: hidden; }
.head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 12px; color: var(--dim);
  letter-spacing: .04em; text-transform: uppercase;
}
.head .path { text-transform: none; letter-spacing: 0; color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.searchbox { padding: 12px 12px 4px; }
#q {
  width: 100%;
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 4px;
  padding: 8px 10px; font: inherit; font-family: var(--mono); font-size: 13px;
}
#q::placeholder { color: var(--dim); }
#q:focus-visible, .tree button:focus-visible, .go:focus-visible, code a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.tree { list-style: none; margin: 0; padding: 8px 6px 12px; font-family: var(--mono); font-size: 13.5px; }
.tree ul { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 1px solid var(--line); margin-left: 12px; }
.tree button {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: transparent; color: var(--fg);
  border: 0; border-radius: 4px;
  padding: 5px 8px; font: inherit; text-align: left; cursor: pointer;
}
.tree button:hover { background: var(--panel-2); }
.tree .folder { color: var(--blue); font-weight: 500; }
.tree .arrow { display: inline-block; width: 10px; color: var(--dim); transition: transform .12s; }
.tree .folder[aria-expanded="true"] .arrow { transform: rotate(90deg); }
.tree .count { margin-left: auto; color: var(--dim); font-size: 12px; }
.tree .leaf[aria-current="true"] { background: rgba(90, 159, 216, .16); color: #fff; }
.tree .dotf { width: 10px; text-align: center; color: var(--yellow); }
.empty { padding: 12px 14px; color: var(--dim); font-size: 14px; }
.body { padding: 18px 18px 20px; }
.kicker { margin: 0 0 4px; font-size: 13px; color: var(--dim); font-family: var(--mono); }
h2 { margin: 0 0 10px; font-size: 26px; line-height: 1.2; font-weight: 600; text-wrap: balance; }
.desc { margin: 0 0 16px; max-width: 60ch; }
.codewrap { overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 12px 0; }
code { display: block; font-family: var(--mono); font-size: 13.5px; line-height: 1.75; counter-reset: ln; min-width: max-content; }
code .l { display: block; white-space: pre; padding-right: 16px; }
code .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 36px; margin-right: 14px; text-align: right; color: var(--com); }
.k { color: var(--blue); }
.s { color: var(--str); }
.v { color: var(--kw); }
.c { color: var(--com); }
code a { color: var(--str); text-decoration: underline; text-underline-offset: 3px; }
.go {
  display: inline-block; margin-top: 16px;
  background: var(--yellow); color: #1a1d25;
  font-weight: 600; text-decoration: none;
  padding: 9px 16px; border-radius: 4px; font-size: 14px;
}
.go:hover { filter: brightness(1.08); }
.meta { margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--dim); }
.pill.free { color: #7ee2a0; border-color: #2f5a42; }
.pill.paid { color: #f2b07a; border-color: #6a4528; }
@media (max-width: 720px) { .app { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .tree .arrow { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1><span class="b">catalog</span><span class="y">.py</span></h1>
    <p class="sub">Каталог программ для Windows.</p>
  </header>

  <div class="app">
    <section class="pane" aria-label="Дерево каталога">
      <div class="head"><span>Каталог</span></div>
      <div class="searchbox">
        <input id="q" type="search" placeholder="поиск: rainmeter, git…" aria-label="Поиск по каталогу" autocomplete="off">
      </div>
      <ul class="tree" id="tree"></ul>
    </section>

    <section class="pane" aria-label="Описание программы" aria-live="polite">
      <div class="head"><span>файл</span><span class="path" id="path"></span></div>
      <div class="body">
        <p class="kicker" id="kicker"></p>
        <h2 id="title"></h2>
        <p class="desc" id="desc"></p>
        <div class="codewrap"><code id="code"></code></div>
        <div class="meta" id="meta"></div>
        <a class="go" id="go" href="#" target="_blank" rel="noopener noreferrer">Открыть сайт программы</a>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  // Замени этот список своими программами. Папка: name и items. Программа: name, desc, price ("free" или "paid"), url.
  var CATALOG = [
    { name: "Оформление", items: [
      { name: "Rainmeter", desc: "Виджеты на рабочий стол: загрузка процессора, память, сеть, часы. Вид задаётся скинами.", price: "free", url: "https://www.rainmeter.net" },
      { name: "TranslucentTB", desc: "Делает панель задач Windows прозрачной или размытой.", price: "free", url: "https://github.com/TranslucentTB/TranslucentTB" },
      { name: "Open-Shell", desc: "Настраиваемое меню «Пуск» в классическом и тёмном стиле.", price: "free", url: "https://open-shell.github.io/Open-Shell-Menu/" },
      { name: "Wallpaper Engine", desc: "Живые обои, в том числе падающий код и киберпанк-сцены.", price: "paid", url: "https://store.steampowered.com/app/431960/Wallpaper_Engine/" }
    ]},
    { name: "Терминал", items: [
      { name: "Windows Terminal", desc: "Современный терминал Microsoft: вкладки, прозрачность, цветовые схемы.", price: "free", url: "https://github.com/microsoft/terminal" },
      { name: "Oh My Posh", desc: "Красивое приглашение командной строки с иконками и информацией о Git.", price: "free", url: "https://ohmyposh.dev" }
    ]},
    { name: "Разработка", items: [
      { name: "Python", desc: "Язык программирования для сайтов, автоматизации и анализа данных.", price: "free", url: "https://www.python.org" },
      { name: "Git", desc: "Система контроля версий. Нужна, чтобы работать с GitHub из командной строки.", price: "free", url: "https://git-scm.com" },
      { name: "Visual Studio Code", desc: "Бесплатный редактор кода с подсветкой синтаксиса и расширениями.", price: "free", url: "https://code.visualstudio.com" }
    ]},
    { name: "Утилиты", items: [
      { name: "7-Zip", desc: "Архиватор: открывает и создаёт ZIP, 7z, RAR и другие архивы.", price: "free", url: "https://www.7-zip.org" },
      { name: "Notepad++", desc: "Лёгкий редактор текста и кода с вкладками и поиском по файлам.", price: "free", url: "https://notepad-plus-plus.org" },
      { name: "Winaero Tweaker", desc: "Тонкая настройка внешнего вида и поведения Windows без ручной правки реестра.", price: "free", url: "https://winaero.com/winaero-tweaker/" }
    ]}
  ];

  var tree = document.getElementById("tree");
  var q = document.getElementById("q");
  var open = {};
  CATALOG.forEach(function (f) { open[f.name] = true; });
  var current = { folder: CATALOG[0].name, name: CATALOG[0].items[0].name };

  function find(folderName, name) {
    for (var i = 0; i < CATALOG.length; i++) {
      if (CATALOG[i].name !== folderName) continue;
      for (var j = 0; j < CATALOG[i].items.length; j++) {
        if (CATALOG[i].items[j].name === name) return CATALOG[i].items[j];
      }
    }
    return null;
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderTree() {
    var term = q.value.trim().toLowerCase();
    tree.textContent = "";
    var shown = 0;
    CATALOG.forEach(function (folder) {
      var items = folder.items.filter(function (it) {
        return !term || it.name.toLowerCase().indexOf(term) !== -1 || it.desc.toLowerCase().indexOf(term) !== -1;
      });
      if (term && !items.length) return;
      shown += items.length;
      var isOpen = term ? true : open[folder.name];
      var li = el("li");
      var fb = el("button", "folder");
      fb.type = "button";
      fb.setAttribute("aria-expanded", isOpen ? "true" : "false");
      fb.appendChild(el("span", "arrow", "▸"));
      fb.appendChild(el("span", null, folder.name + "/"));
      fb.appendChild(el("span", "count", String(items.length)));
      fb.addEventListener("click", function () {
        open[folder.name] = !open[folder.name];
        renderTree();
      });
      li.appendChild(fb);
      if (isOpen) {
        var ul = el("ul");
        items.forEach(function (it) {
          var lli = el("li");
          var b = el("button", "leaf");
          b.type = "button";
          if (current.folder === folder.name && current.name === it.name) b.setAttribute("aria-current", "true");
          b.appendChild(el("span", "dotf", "•"));
          b.appendChild(el("span", null, it.name));
          b.addEventListener("click", function () {
            current = { folder: folder.name, name: it.name };
            renderTree(); renderDetail();
          });
          lli.appendChild(b);
          ul.appendChild(lli);
        });
        li.appendChild(ul);
      }
      tree.appendChild(li);
    });
    if (!shown) {
      var e = el("li", "empty", "Ничего не найдено. Попробуй другое слово.");
      tree.appendChild(e);
    }
  }

  function line(parts) {
    var d = el("span", "l");
    parts.forEach(function (p) {
      if (typeof p === "string") { d.appendChild(document.createTextNode(p)); return; }
      var node;
      if (p.href) {
        node = el("a", p.c, p.t);
        node.href = p.href; node.target = "_blank"; node.rel = "noopener noreferrer";
      } else { node = el("span", p.c, p.t); }
      d.appendChild(node);
    });
    return d;
  }

  function renderDetail() {
    var it = find(current.folder, current.name);
    if (!it) return;
    document.getElementById("path").textContent = "catalog / " + current.folder + " / " + it.name;
    document.getElementById("kicker").textContent = current.folder + "/";
    document.getElementById("title").textContent = it.name;
    document.getElementById("desc").textContent = it.desc;
    var priceText = it.price === "paid" ? "платная" : "бесплатная";
    var code = document.getElementById("code");
    code.textContent = "";
    code.appendChild(line([{ c: "c", t: "# " + it.desc }]));
    code.appendChild(line([{ c: "v", t: "program" }, " = {"]));
    code.appendChild(line(["    ", { c: "s", t: '"name"' }, ": ", { c: "s", t: JSON.stringify(it.name) }, ","]));
    code.appendChild(line(["    ", { c: "s", t: '"folder"' }, ": ", { c: "s", t: JSON.stringify(current.folder) }, ","]));
    code.appendChild(line(["    ", { c: "s", t: '"free"' }, ": ", { c: "k", t: it.price === "free" ? "True" : "False" }, ","]));
    code.appendChild(line(["    ", { c: "s", t: '"site"' }, ": ", '"', { c: "s", t: it.url, href: it.url }, '"', ","]));
    code.appendChild(line(["}"]));
    var meta = document.getElementById("meta");
    meta.textContent = "";
    meta.appendChild(el("span", "pill " + (it.price === "paid" ? "paid" : "free"), priceText));
    meta.appendChild(el("span", "pill", "Windows 10"));
    var go = document.getElementById("go");
    go.href = it.url;
  }

  q.addEventListener("input", renderTree);
  renderTree();
  renderDetail();
})();
</script>

</html>
